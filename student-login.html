<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ESLD – Student Login</title>
<link rel="icon" href="esld-logo.png" type="image/png">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{
  --red:#ED1C2E; --red-dark:#c4141f;
  --bg-soft:#fff5f6; --ink:#1f2330; --muted:#5b6172;
  --line:#e4e6ee; --error:#b00020; --error-bg:#fdecee;
  --radius:24px;
}
*{box-sizing:border-box;margin:0;padding:0}
body{
  font-family:'Nunito',system-ui,sans-serif; color:var(--ink);
  background:linear-gradient(180deg,var(--bg-soft),#fff 60%);
  min-height:100vh; display:flex; align-items:center; justify-content:center; padding:24px 16px;
}
.card{
  width:100%; max-width:420px; background:#fff; border:1px solid var(--line);
  border-radius:var(--radius); box-shadow:0 18px 40px -20px rgba(237,28,46,.25);
  padding:36px 28px; text-align:center;
}
.logo{display:block; width:180px; max-width:70%; height:auto; margin:0 auto 12px}
.logo-fallback{display:none; font-size:44px; font-weight:900; color:var(--red); letter-spacing:1px; margin-bottom:8px}
h1{font-size:26px; font-weight:900; margin-bottom:6px}
.lede{color:var(--muted); font-size:15px; margin-bottom:24px; line-height:1.5}
label{display:block; text-align:left; font-weight:700; font-size:15px; margin-bottom:8px}
input{
  width:100%; font:inherit; font-size:20px; padding:14px 16px; border:2px solid var(--line);
  border-radius:14px; text-align:center; letter-spacing:2px; text-transform:uppercase;
  color:var(--ink); outline:none; background:#fff;
}
input:focus{border-color:var(--red); box-shadow:0 0 0 4px rgba(237,28,46,.15)}
input.invalid{border-color:var(--error)}
.hint{text-align:left; font-size:13px; color:var(--muted); margin-top:6px}
.error{
  display:none; margin-top:14px; padding:12px 14px; border-radius:12px;
  background:var(--error-bg); color:var(--error); font-weight:700; font-size:14px; text-align:left;
}
.error.show{display:block}
button.cta{
  margin-top:20px; width:100%; min-height:60px; border:none; border-radius:999px;
  background:var(--red); color:#fff; font:inherit; font-size:22px; font-weight:900;
  cursor:pointer; transition:background .15s, transform .1s;
}
button.cta:hover{background:var(--red-dark)}
button.cta:active{transform:scale(.98)}
button.cta:disabled{opacity:.7; cursor:wait}
button.cta:focus-visible, input:focus-visible{outline:3px solid #111; outline-offset:3px}
.footer-note{margin-top:22px; font-size:13px; color:var(--muted)}
@media (prefers-reduced-motion:reduce){*{transition:none !important}}
</style>
</head>
<body>
<main class="card">
  <img class="logo" src="esld-logo.png" alt="ESLD logo"
       onerror="this.style.display='none';document.getElementById('logoFallback').style.display='block'">
  <div class="logo-fallback" id="logoFallback" aria-hidden="true">ESLD</div>

  <h1>Hi there, learner! 👋</h1>
  <p class="lede">Type your Student ID to start learning.</p>

  <form id="loginForm" novalidate>
    <label for="studentId">Student ID</label>
    <input id="studentId" name="studentId" type="text"
           autocomplete="off" autocapitalize="characters" spellcheck="false"
           placeholder="e.g. ESLD-DEMO-001"
           aria-describedby="idHint errorBox" required>
    <p class="hint" id="idHint">Your ID is on the card from your teacher.</p>

    <div class="error" id="errorBox" role="alert" aria-live="assertive"></div>

    <button class="cta" id="submitBtn" type="submit">Let's Learn! 🚀</button>
  </form>

  <p class="footer-note">Having trouble? Ask your teacher to check your Student ID.</p>
</main>

<script>
const API_BASE   = '';  // same origin; set to e.g. 'http://localhost:5000' if the backend runs on another port
const form       = document.getElementById('loginForm');
const input      = document.getElementById('studentId');
const errorBox   = document.getElementById('errorBox');
const btn        = document.getElementById('submitBtn');
const ID_PATTERN = /^[A-Z0-9-]{3,20}$/;

function showError(msg){
  errorBox.textContent = msg;
  errorBox.classList.add('show');
  input.classList.add('invalid');
  input.setAttribute('aria-invalid', 'true');
  input.focus();
}
function clearError(){
  errorBox.classList.remove('show');
  errorBox.textContent = '';
  input.classList.remove('invalid');
  input.removeAttribute('aria-invalid');
}
function setLoading(on){
  btn.disabled = on;
  btn.textContent = on ? 'Opening your lessons…' : "Let's Learn! 🚀";
}

/* Compatibility shim: pages not yet migrated still read sessionStorage to
   decide whether to show content. This is NOT authentication. The server
   session is the only thing that grants access. Remove once every page
   calls the /me endpoint. */
function setCompatSid(sid){ try{ sessionStorage.setItem('studentId', sid); }catch(_){} }

// If a valid session already exists, skip the form and go to the dashboard.
(async () => {
  try{
    const r = await fetch(API_BASE + '/api/student/me', { credentials: 'same-origin' });
    if (r.ok){
      const me = await r.json();
      setCompatSid(me.sid);
      location.replace('student-dashboard.html');
    }
  }catch(_){ /* server unreachable: stay on the login form */ }
})();

form.addEventListener('submit', async (e) => {
  e.preventDefault();
  clearError();

  const sid = input.value.trim().toUpperCase();
  if (!sid){ showError('Oops! Please type your Student ID first.'); return; }
  if (!ID_PATTERN.test(sid)){
    showError("That doesn't look right. Student IDs use letters, numbers and dashes.");
    return;
  }

  setLoading(true);

  let res;
  try{
    res = await fetch(API_BASE + '/api/student/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      credentials: 'same-origin',
      body: JSON.stringify({ studentId: sid })
    });
  }catch(_){
    setLoading(false);
    showError("We can't reach ESLD right now. Please try again in a moment.");
    return;
  }

  const data = await res.json().catch(() => ({}));
  if (!res.ok){
    setLoading(false);
    showError(data.error || 'Something went wrong. Please try again.');
    return;
  }

  setCompatSid(sid);
  location.href = 'student-dashboard.html';
});
</script>
</body>
</html>
